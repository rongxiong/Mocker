name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Prettier
        run: npm run format:check

  test:
    name: Unit tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22.5+ is required for the built-in `node:sqlite` driver.
        node: [24, 26]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

  build:
    name: Build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build web console
        run: npm run build

      - name: Upload web bundle
        uses: actions/upload-artifact@v7
        with:
          name: dist-web
          path: dist/web
          if-no-files-found: error

      - name: Smoke test the production server
        run: |
          npm start > /tmp/mocker.log 2>&1 &
          server_pid=$!
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/__api/info > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3001/__api/info
          curl -fsS http://127.0.0.1:3001/api/users/1
          kill "$server_pid"

      - name: Server log
        if: failure()
        run: cat /tmp/mocker.log
